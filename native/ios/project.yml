# The Xcode project, generated rather than committed.
#
# A `.pbxproj` is thirty kilobytes of machine-written references in which every
# meaningful change — a file added, a setting flipped — is invisible under the
# churn, and two branches touching it conflict every time. This file is the
# project as a reviewer can read it.
#
#   brew install xcodegen
#   cd native/ios && xcodegen generate && open Stapes.xcodeproj
#
# `Stapes.xcodeproj` is gitignored. Regenerating it is safe and takes a second;
# anything set by hand in Xcode is lost, so settings belong here.
name: Stapes
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

targets:
  Stapes:
    type: application
    platform: iOS
    sources:
      - path: Stapes
    info:
      path: Stapes/Info.plist
      properties:
        CFBundleDisplayName: Stapes
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.stapes
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Signing is per machine and per account, so it is not written down
        # here. Set the team once in Xcode's Signing & Capabilities tab, or pass
        # `DEVELOPMENT_TEAM` on the `xcodebuild` command line in CI.
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.9"
        ENABLE_USER_SCRIPT_SANDBOXING: true
        TARGETED_DEVICE_FAMILY: "1,2"
