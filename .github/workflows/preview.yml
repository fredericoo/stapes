name: PR preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  client:
    name: client for preview
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PREVIEW_ORIGIN: https://pr-${{ github.event.number }}.${{ vars.PREVIEW_DOMAIN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Say if the box is crowded
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OPEN=$(gh pr list --state open --json number --jq 'length')
          MAX=${{ vars.MAX_PREVIEWS || 4 }}
          if [ "$OPEN" -gt "$MAX" ]; then
            echo "::warning::$OPEN pull requests are open and about $MAX previews fit on this box. Close one, or raise MAX_PREVIEWS once the machine is bigger."
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile
      - run: bun run build

      - name: Wait for Coolify to finish deploying this commit
        env:
          PR: ${{ github.event.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          BODY: ${{ runner.temp }}/coolify-deployments.json
        run: |
          give_up() {
            MESSAGE="Coolify has not finished a deployment of ${SHA} for pull request ${PR} in fifteen minutes — the last it said was ${STATUS}."
            if [ "$STATUS" = absent ]; then
              MESSAGE="${MESSAGE} An absent one was never queued: check that the pull request is based on the default branch, then the preview application's watch paths, and whether the title or the head commit carries a skip marker."
            fi
            echo "::error::${MESSAGE}"
            exit 1
          }

          for i in $(seq 1 90); do
            CODE=$(curl -sS --max-time 10 -o "$BODY" -w '%{http_code}' \
              "${{ vars.COOLIFY_URL }}/api/v1/deployments/applications/${{ vars.COOLIFY_PREVIEW_APP_UUID }}?take=20" \
              -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}") || CODE=none
            case "$CODE" in
              2??)
                STATUS=$(jq -r --argjson pr "$PR" --arg sha "$SHA" \
                  '[.deployments[] | select(.pull_request_id == $pr and .commit == $sha)][0].status // "absent"' "$BODY")
                ;;
              401|403)
                echo "::error::Coolify rejected COOLIFY_TOKEN with HTTP ${CODE}. Regenerate the token in Coolify and update the COOLIFY_TOKEN repository secret — waiting will not fix this."
                exit 1
                ;;
              404)
                echo "::error::Coolify answered HTTP 404 for the preview application's deployments. Check vars.COOLIFY_PREVIEW_APP_UUID against the application in Coolify, and vars.COOLIFY_URL against the panel's address."
                exit 1
                ;;
              none)
                STATUS="unreachable (no answer)"
                ;;
              *)
                STATUS="unreachable (HTTP ${CODE})"
                ;;
            esac
            case "$STATUS" in
              finished)
                echo "deployment finished after $((i * 10))s"; break
                ;;
              failed|cancelled-by-user)
                echo "::error::Coolify deployment $STATUS — see its log in the panel"
                exit 1
                ;;
            esac
            if [ "$i" = 90 ]; then give_up; fi
            sleep 10
          done

      - name: Wait for the world to answer
        run: |
          for i in $(seq 1 60); do
            if curl -fsS --max-time 5 "${PREVIEW_ORIGIN}/api/health" | grep -q '"status":"ok"'; then
              echo "healthy after ${i} attempts"; exit 0
            fi
            sleep 5
          done
          echo "::error::preview did not come up healthy within five minutes"
          exit 1

      - name: Sync the world's content to this commit
        run: |
          curl --fail-with-body -sS -X POST "${PREVIEW_ORIGIN}/api/seed" \
            -H "Authorization: Bearer ${{ secrets.PREVIEW_ADMIN_SECRET }}"

      - name: Upload the client
        run: |
          tar -cf client.tar -C build/client .
          curl --fail-with-body -sS -X POST "${PREVIEW_ORIGIN}/api/client/upload" \
            -H "Authorization: Bearer ${{ secrets.PREVIEW_ADMIN_SECRET }}" \
            -F "buildId=${{ github.event.pull_request.head.sha }}" \
            -F "archive=@client.tar"

      - name: Activate the client
        run: |
          curl --fail-with-body -sS -X POST "${PREVIEW_ORIGIN}/api/client/activate" \
            -H "Authorization: Bearer ${{ secrets.PREVIEW_ADMIN_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"buildId":"${{ github.event.pull_request.head.sha }}"}'

      - name: Check the client and the server agree on the protocol version
        run: |
          fail() { echo "::error::$1"; exit 1; }

          SERVER_VERSION=$(curl -fsS --max-time 10 "${PREVIEW_ORIGIN}/api/health" | jq -r '.protocolVersion // empty')
          [ -n "$SERVER_VERSION" ] || fail "the preview's /api/health reported no protocolVersion"

          PAGE=$(curl -fsS --max-time 10 "${PREVIEW_ORIGIN}/")
          MANIFEST=$(printf '%s' "$PAGE" | grep -oE '/assets/manifest-[A-Za-z0-9_-]+\.js' | head -1)
          [ -n "$MANIFEST" ] || fail "the preview's / names no route manifest, so no client bundle is being served"

          MAIN=$(curl -fsS --max-time 10 "${PREVIEW_ORIGIN}${MANIFEST}" | grep -oE '/assets/game-main-[A-Za-z0-9_-]+\.js' | head -1)
          [ -n "$MAIN" ] || fail "${MANIFEST} names no game-main chunk — the game route is app/routes/game.tsx, and this step is named after it"

          CLIENT_VERSION=$(curl -fsS --max-time 10 "${PREVIEW_ORIGIN}${MAIN}" \
            | grep -oE 'searchParams\.set\(["'"'"'`]v["'"'"'`],[^)]*[0-9]+' \
            | grep -oE '[0-9]+$' | head -1)
          [ -n "$CLIENT_VERSION" ] || fail "no protocol version found in ${MAIN} — if the socket URL stopped being built with searchParams.set, this step needs teaching the new shape rather than deleting"

          if [ "$CLIENT_VERSION" != "$SERVER_VERSION" ]; then
            fail "the served client speaks protocol v${CLIENT_VERSION} and the server speaks v${SERVER_VERSION}, so every socket is closed with 4001 and nobody can enter this preview. The branch is behind a main that bumped PROTOCOL_VERSION — rebase it."
          fi
          echo "client and server both speak protocol v${SERVER_VERSION}"

      - name: Say what is live
        run: curl -sS "${PREVIEW_ORIGIN}/api/health"
