# A world per pull request.
#
# One container, because the server serves its own client: there is no separate
# static site and no per-PR proxy rule beyond the hostname. And nothing to
# provision for state — the container comes up against an empty volume, builds
# its own world from the `data/` in its image, and Coolify destroys the volume
# with the PR.
name: PR preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  deploy:
    name: deploy preview
    # Forks do not get the repository's secrets, so this would fail on
    # authentication rather than on anything the contributor did.
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - name: Deploy
        run: |
          curl --fail-with-body -X GET \
            "${{ vars.COOLIFY_URL }}/api/v1/deploy?uuid=${{ vars.COOLIFY_PREVIEW_APP_UUID }}&pr=${{ github.event.number }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"

      # Posted from a deterministic hostname rather than read back. Coolify's
      # compose deployments have a known gap where the preview URL is not
      # returned, and a comment that waits for one never appears.
      - name: Comment the URL
        uses: actions/github-script@v7
        with:
          script: |
            const url = `https://pr-${{ github.event.number }}.${{ vars.PREVIEW_DOMAIN }}`;
            const marker = '<!-- stapes-preview -->';
            const body = `${marker}\nA world of its own: ${url}\n\nIts own database, seeded from this branch's \`data/\`. Destroyed when this closes.`;
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

  teardown:
    name: destroy preview
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      # Coolify removes the container, volume and network scoped to the PR id.
      # Verify that against a throwaway pull request before trusting it: a
      # preview volume that quietly survives is a slow disk leak whose first
      # symptom is a full disk months later.
      - name: Delete
        run: |
          curl --fail-with-body -X DELETE \
            "${{ vars.COOLIFY_URL }}/api/v1/applications/${{ vars.COOLIFY_PREVIEW_APP_UUID }}/preview/${{ github.event.number }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"
