name: PR preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  image:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.action != 'closed'
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
      packages: write
    with:
      sha: ${{ github.event.pull_request.head.sha }}

  client:
    name: client for preview
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Built from the PR number because Coolify's compose deployments do not return the preview URL.
      PREVIEW_ORIGIN: https://pr-${{ github.event.number }}.${{ vars.PREVIEW_DOMAIN }}
    steps:
      # The head commit, which is what Coolify deploys. The default merge ref would
      # build main's client to run against the branch's server.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Say if this preview may be stopped
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OPEN=$(gh pr list --state open --json number --jq 'length')
          MAX=${{ vars.MAX_PREVIEWS || 5 }}
          if [ "$OPEN" -gt "$MAX" ]; then
            echo "::warning::$OPEN pull requests are open and only the $MAX most recently pushed keep a running preview. A stopped one comes back on its next push."
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile
      - run: bun run build

      # Preview deployments are off on the application, so its GitHub webhook does not deploy a push
      # before its image exists; it only removes the preview when the pull request closes. This call
      # creates the preview on the first push and deploys the commit on every one.
      - name: Deploy this commit's image as the preview
        env:
          BODY: ${{ runner.temp }}/coolify-deploy.json
          REQUEST: '{"pull_request_id":${{ github.event.number }},"pull_request_html_url":"${{ github.event.pull_request.html_url }}","commit":"${{ github.event.pull_request.head.sha }}","git_type":"github"}'
        run: |
          CODE=$(curl -sS --max-time 30 -o "$BODY" -w '%{http_code}' -X POST \
            "${{ vars.COOLIFY_URL }}/api/v1/applications/${{ vars.COOLIFY_PREVIEW_APP_UUID }}/previews" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$REQUEST") || CODE=none
          case "$CODE" in
            2??) ;;
            401|403)
              echo "::error::Coolify rejected COOLIFY_TOKEN with HTTP ${CODE}. Opening a preview needs a token with the deploy and write permissions."
              exit 1
              ;;
            *)
              echo "::error::Coolify answered HTTP ${CODE} to the preview deploy: $(cat "$BODY" 2>/dev/null)"
              exit 1
              ;;
          esac
          ID=$(jq -r '.deployment_uuid // empty' "$BODY")
          if [ -z "$ID" ]; then
            echo "::error::Coolify queued no deployment: $(cat "$BODY")"
            exit 1
          fi
          echo "DEPLOYMENT=$ID" >> "$GITHUB_ENV"

      - name: Wait for Coolify to finish deploying it
        run: |
          for i in $(seq 1 90); do
            STATUS=$(curl -fsS --max-time 10 \
              "${{ vars.COOLIFY_URL }}/api/v1/deployments/${DEPLOYMENT}" \
              -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" | jq -r '.status') || STATUS=unreachable
            case "$STATUS" in
              finished)
                echo "deployment finished after $((i * 10))s"; exit 0
                ;;
              failed|cancelled-by-user)
                echo "::error::Coolify deployment $STATUS — see its log in the panel"
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "::error::Coolify has not finished deploying ${DEPLOYMENT} in fifteen minutes — the last it said was ${STATUS}."
          exit 1

      - name: Wait for the world to answer
        run: |
          for i in $(seq 1 60); do
            if curl -fsS --max-time 5 "${PREVIEW_ORIGIN}/api/health" | grep -q '"status":"ok"'; then
              echo "healthy after ${i} attempts"; exit 0
            fi
            sleep 5
          done
          echo "::error::preview did not come up healthy within five minutes"
          exit 1

      - name: Sync the world's content to this commit
        run: |
          curl --fail-with-body -sS -X POST "${PREVIEW_ORIGIN}/api/seed" \
            -H "Authorization: Bearer ${{ secrets.PREVIEW_ADMIN_SECRET }}"

      - name: Upload the client
        run: |
          tar -cf client.tar -C build/client .
          curl --fail-with-body -sS -X POST "${PREVIEW_ORIGIN}/api/client/upload" \
            -H "Authorization: Bearer ${{ secrets.PREVIEW_ADMIN_SECRET }}" \
            -F "buildId=${{ github.event.pull_request.head.sha }}" \
            -F "archive=@client.tar"

      - name: Activate the client
        run: |
          curl --fail-with-body -sS -X POST "${PREVIEW_ORIGIN}/api/client/activate" \
            -H "Authorization: Bearer ${{ secrets.PREVIEW_ADMIN_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"buildId":"${{ github.event.pull_request.head.sha }}"}'

      - name: Check the client and the server agree on the protocol version
        run: |
          fail() { echo "::error::$1"; exit 1; }

          SERVER_VERSION=$(curl -fsS --max-time 10 "${PREVIEW_ORIGIN}/api/health" | jq -r '.protocolVersion // empty')
          [ -n "$SERVER_VERSION" ] || fail "the preview's /api/health reported no protocolVersion"

          PAGE=$(curl -fsS --max-time 10 "${PREVIEW_ORIGIN}/")
          MANIFEST=$(printf '%s' "$PAGE" | grep -oE '/assets/manifest-[A-Za-z0-9_-]+\.js' | head -1)
          [ -n "$MANIFEST" ] || fail "the preview's / names no route manifest, so no client bundle is being served"

          MAIN=$(curl -fsS --max-time 10 "${PREVIEW_ORIGIN}${MANIFEST}" | grep -oE '/assets/game-main-[A-Za-z0-9_-]+\.js' | head -1)
          [ -n "$MAIN" ] || fail "${MANIFEST} names no game-main chunk — the game route is app/routes/game.tsx, and this step is named after it"

          CLIENT_VERSION=$(curl -fsS --max-time 10 "${PREVIEW_ORIGIN}${MAIN}" \
            | grep -oE 'searchParams\.set\(["'"'"'`]v["'"'"'`],[^)]*[0-9]+' \
            | grep -oE '[0-9]+$' | head -1)
          [ -n "$CLIENT_VERSION" ] || fail "no protocol version found in ${MAIN} — if the socket URL stopped being built with searchParams.set, this step needs teaching the new shape rather than deleting"

          if [ "$CLIENT_VERSION" != "$SERVER_VERSION" ]; then
            fail "the served client speaks protocol v${CLIENT_VERSION} and the server speaks v${SERVER_VERSION}, so every socket is closed with 4001 and nobody can enter this preview. The branch is behind a main that bumped PROTOCOL_VERSION — rebase it."
          fi
          echo "client and server both speak protocol v${SERVER_VERSION}"

      - name: Say what is live
        run: curl -sS "${PREVIEW_ORIGIN}/api/health"

  remove:
    name: remove the preview
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      # The webhook usually removes it first, which leaves this a 404.
      - name: Remove the preview from Coolify
        run: |
          CODE=$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' -X DELETE \
            "${{ vars.COOLIFY_URL }}/api/v1/applications/${{ vars.COOLIFY_PREVIEW_APP_UUID }}/previews/${{ github.event.number }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}")
          case "$CODE" in
            2??|404) echo "preview ${{ github.event.number }}: HTTP ${CODE}" ;;
            *) echo "::error::Coolify answered HTTP ${CODE} to removing the preview"; exit 1 ;;
          esac
