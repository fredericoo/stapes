name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      version: ${{ fromJSON(steps.changesets.outputs['published-packages'] || '[]')[0].version }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # changesets/action runs the CLI with `node`, and @changesets/cli 3 needs Node 22.11 or later.
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      # With changesets pending this opens or updates the release PR. With none, it tags a version
      # that has no tag yet and creates its GitHub Release from the CHANGELOG.md entry.
      - uses: changesets/action@v2.1.2
        id: changesets
        with:
          publish-script: bun --bun x changeset git-tag
          pr-title: "chore(release): version the game and write its changelog"
          commit-message: "chore(release): version the game and write its changelog"
          pr-draft: create

  production:
    name: production
    needs: release
    if: needs.release.outputs.published == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
    secrets: inherit

  announce:
    name: announce on Discord
    needs: [release, production]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v${{ needs.release.outputs.version }}
      WEBHOOK_URL: ${{ secrets.DISCORD_CHANGELOG_WEBHOOK_URL }}
    steps:
      # The headings are the ones changesets writes for a semver bump; players read them as these.
      # Discord caps an embed's description at 4096 characters, so long notes end at a whole line.
      - name: Post the release notes
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::warning::DISCORD_CHANGELOG_WEBHOOK_URL is not set, so ${TAG} was not announced"
            exit 0
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body,url > release.json
          jq --arg tag "$TAG" '{
            embeds: [{
              title: "The Last Stones \($tag)",
              url: .url,
              description: (.url as $url | .body
                | gsub("### Major Changes"; "### Big changes")
                | gsub("### Minor Changes"; "### New")
                | gsub("### Patch Changes"; "### Fixes")
                | if length > 3900
                  then (.[0:3900] | .[0:rindex("\n")]) + "\n\n[The rest of this release](\($url))"
                  else . end)
            }]
          }' release.json > message.json
          curl --fail-with-body -sS --max-time 30 -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" --data @message.json
