# Push to main, and both halves go out.
#
# There are no players yet, so a couple of seconds of downtime per merge costs
# nothing and buys a pipeline nobody has to think about. When that stops being
# true, the thing to reach for is the client/server split below — it is already
# separated, and only the trigger would need to change.
name: Deploy

on:
  push:
    branches: [main]
  # Also by hand: GitHub's mobile app puts a Run workflow button on this, and an
  # agent can run `gh workflow run deploy.yml`. Useful for redeploying without
  # an empty commit.
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - run: bun install --frozen-lockfile
      - run: bun run build

      # ---------------------------------------------------------------------
      # The order below is the only subtle thing in this file.
      #
      # Upload, then restart the server, then activate. Uploading is inert —
      # the files land on the volume and nothing serves them — so it can happen
      # against the *old* server safely, and they survive its restart because
      # the volume is not part of the image.
      #
      # Activating last is what keeps a `PROTOCOL_VERSION` bump survivable. The
      # alternative order puts a new client in front of an old server, every tab
      # is told it is outdated, reloads, and gets the same new client again —
      # a reload loop that lasts until the server catches up.
      # ---------------------------------------------------------------------

      - name: Snapshot the world
        run: |
          curl --fail-with-body -sS -X POST "${{ vars.PUBLIC_ORIGIN }}/api/backup" \
            -H "Authorization: Bearer ${{ secrets.ADMIN_SECRET }}"

      - name: Upload the client, without activating it
        run: |
          tar -cf client.tar -C build/client .
          curl --fail-with-body -sS -X POST "${{ vars.PUBLIC_ORIGIN }}/api/client/upload" \
            -H "Authorization: Bearer ${{ secrets.ADMIN_SECRET }}" \
            -F "buildId=${{ github.sha }}" \
            -F "archive=@client.tar"

      - name: Deploy the server
        id: deploy
        run: |
          RESPONSE=$(curl --fail-with-body -sS -X POST "${{ vars.COOLIFY_URL }}/api/v1/deploy" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"uuid":"${{ vars.COOLIFY_APP_UUID }}","force":false}')
          echo "$RESPONSE"
          # Named, because the wait below has to watch *this* deploy. Coolify
          # answers with one entry per resource it queued; there is one.
          ID=$(printf '%s' "$RESPONSE" | jq -r '.deployments[0].deployment_uuid // empty')
          if [ -z "$ID" ]; then
            echo "::error::Coolify queued no deployment — check the app uuid"
            exit 1
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------------------
      # **Watch the deploy, not the origin.** Coolify returns as soon as the
      # deploy is *queued*, and the container it is replacing goes on serving
      # perfectly until the moment it is swapped — so asking `/api/health`
      # whether the server is back gets `ok` on the first attempt, from the
      # process this deploy exists to replace. It is not a slow check, it is a
      # check that cannot fail: measured at 0 seconds against a container that
      # was not built for another 26.
      #
      # That silently undid the ordering the top of this file is about. The
      # activation below ran against the *old* server while the new one was
      # still building, which is the new-client-in-front-of-old-server case a
      # `PROTOCOL_VERSION` bump turns into a reload loop.
      #
      # So the deployment record is what is waited on, and the origin is only
      # asked afterwards — by then a healthy answer can only come from the
      # container this deploy built.
      # ---------------------------------------------------------------------
      - name: Wait for the new container
        run: |
          for i in $(seq 1 120); do
            STATUS=$(curl -fsS --max-time 10 \
              "${{ vars.COOLIFY_URL }}/api/v1/deployments/${{ steps.deploy.outputs.id }}" \
              -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" | jq -r '.status')
            case "$STATUS" in
              finished)
                echo "deployment finished after $((i * 5))s"
                break
                ;;
              failed|cancelled-by-user)
                echo "::error::Coolify deployment $STATUS — see its log in the panel"
                exit 1
                ;;
            esac
            if [ "$i" = 120 ]; then
              echo "::error::deployment still ${STATUS} after ten minutes"
              exit 1
            fi
            sleep 5
          done

      - name: Wait for it to come back
        run: |
          for i in $(seq 1 60); do
            if curl -fsS --max-time 5 "${{ vars.PUBLIC_ORIGIN }}/api/health" \
               | grep -q '"status":"ok"'; then
              echo "healthy after ${i} attempts"; exit 0
            fi
            sleep 5
          done
          echo "::error::server did not come back healthy within five minutes"
          exit 1

      - name: Activate the client
        run: |
          curl --fail-with-body -sS -X POST "${{ vars.PUBLIC_ORIGIN }}/api/client/activate" \
            -H "Authorization: Bearer ${{ secrets.ADMIN_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"buildId":"${{ github.sha }}"}'

      - name: Say what is live
        run: |
          curl -sS "${{ vars.PUBLIC_ORIGIN }}/api/health"

      # Cloudflare hides a renewal failure completely: it goes on serving its
      # own edge certificate to visitors, so the first symptom of a broken
      # renewal is the day the origin certificate lapses and Full (strict)
      # starts refusing to talk to us. Checked here because a deploy is the
      # cheapest place to notice, and a warning is enough — this fails soft.
      - name: Warn if the origin certificate is running out
        continue-on-error: true
        run: |
          HOST=$(echo "${{ vars.PUBLIC_ORIGIN }}" | sed 's|https\?://||')
          END=$(echo | openssl s_client -servername "$HOST" -connect "${{ vars.ORIGIN_IP }}:443" 2>/dev/null \
                | openssl x509 -noout -enddate | cut -d= -f2)
          LEFT=$(( ( $(date -d "$END" +%s) - $(date +%s) ) / 86400 ))
          echo "origin certificate expires in ${LEFT} days ($END)"
          if [ "$LEFT" -lt 21 ]; then
            echo "::warning::origin certificate expires in ${LEFT} days and Cloudflare will not tell you — check ACME renewal on the box"
          fi
