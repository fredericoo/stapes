# Two deploys, and only one of them restarts anything.
#
# The client is files: CI pushes them to an immutable prefix in the bucket and
# then flips a pointer, so a UI change reaches everybody without the world
# process stopping and without anybody being disconnected.
#
# The server is an image, and deploying it *is* a restart — announced, drained,
# and about two seconds long. See `server/world.ts`.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  client:
    name: client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - run: bun install --frozen-lockfile
      - run: bun run build

      # One archive, one request. A file per request would be a deploy that can
      # half-finish, and the server only makes a build live once the whole of it
      # has landed.
      - name: Upload the build
        run: |
          tar -cf client.tar -C build/client .
          curl --fail-with-body -X POST "${{ vars.PUBLIC_ORIGIN }}/api/client/upload" \
            -H "Authorization: Bearer ${{ secrets.ADMIN_SECRET }}" \
            -F "buildId=${{ github.sha }}" \
            -F "archive=@client.tar"

      # The flip. The server reads the build in, swaps it when the whole of it
      # is resident, and goes on serving throughout — nobody is disconnected.
      - name: Activate
        run: |
          curl --fail-with-body -X POST "${{ vars.PUBLIC_ORIGIN }}/api/client/activate" \
            -H "Authorization: Bearer ${{ secrets.ADMIN_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"buildId":"${{ github.sha }}"}'

  server:
    name: server
    runs-on: ubuntu-latest
    # Only when the world itself changed. Most commits are client-only, and
    # restarting for those would disconnect everybody to ship a colour.
    if: contains(github.event.head_commit.message, '[server]') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5

      # Before the container is replaced, not after. A deploy is the most likely
      # moment for something to go wrong, and this is the copy you would want.
      - name: Snapshot the world first
        run: |
          curl --fail-with-body -X POST "${{ vars.PUBLIC_ORIGIN }}/api/backup" \
            -H "Authorization: Bearer ${{ secrets.ADMIN_SECRET }}"

      - name: Trigger Coolify deploy
        run: |
          curl --fail-with-body -X GET \
            "${{ vars.COOLIFY_URL }}/api/v1/deploy?uuid=${{ vars.COOLIFY_APP_UUID }}&force=false" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"
