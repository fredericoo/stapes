name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Where to deploy the selected ref
        type: choice
        options: [staging, production]
        default: staging
  workflow_call:
    inputs:
      environment:
        type: string
        required: true

jobs:
  deploy:
    name: deploy to ${{ inputs.environment || 'staging' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Every variable and secret below comes from this GitHub environment, so one workflow serves both
    # worlds. A push to main has no inputs and lands on staging; production is reached through
    # release.yml or a manual run.
    environment:
      name: ${{ inputs.environment || 'staging' }}
      url: ${{ vars.PUBLIC_ORIGIN }}
    concurrency:
      group: deploy-${{ inputs.environment || 'staging' }}
      cancel-in-progress: false
    steps:
      # GitHub falls back to a repository-level value when the environment lacks one, which would
      # point a staging deploy at production. DEPLOY_ENVIRONMENT exists only on the environments.
      - name: Check this is the environment the settings belong to
        env:
          TARGET: ${{ inputs.environment || 'staging' }}
          SETTINGS_FOR: ${{ vars.DEPLOY_ENVIRONMENT }}
          HAS_ORIGIN: ${{ vars.PUBLIC_ORIGIN != '' }}
          HAS_APP: ${{ vars.COOLIFY_APP_UUID != '' }}
          HAS_SECRET: ${{ secrets.ADMIN_SECRET != '' }}
        run: |
          if [ "$SETTINGS_FOR" != "$TARGET" ]; then
            echo "::error::Deploying to ${TARGET}, but DEPLOY_ENVIRONMENT is '${SETTINGS_FOR}'. Set it on the ${TARGET} environment."
            exit 1
          fi
          if [ "$HAS_ORIGIN$HAS_APP$HAS_SECRET" != truetruetrue ]; then
            echo "::error::The ${TARGET} environment needs PUBLIC_ORIGIN, COOLIFY_APP_UUID and ADMIN_SECRET"
            exit 1
          fi

      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile
      - run: bun run build

      # Staging's map is replaced on every merge and nothing prunes its backups volume, so a snapshot
      # there would only fill the preview box's disk.
      - name: Snapshot the world
        if: (inputs.environment || 'staging') == 'production'
        run: |
          curl --fail-with-body -sS -X POST "${{ vars.PUBLIC_ORIGIN }}/api/backup" \
            -H "Authorization: Bearer ${{ secrets.ADMIN_SECRET }}"

      - name: Upload the client, without activating it
        run: |
          tar -cf client.tar -C build/client .
          curl --fail-with-body -sS -X POST "${{ vars.PUBLIC_ORIGIN }}/api/client/upload" \
            -H "Authorization: Bearer ${{ secrets.ADMIN_SECRET }}" \
            -F "buildId=${{ github.sha }}" \
            -F "archive=@client.tar"

      - name: Deploy the server
        id: deploy
        run: |
          RESPONSE=$(curl --fail-with-body -sS -X POST "${{ vars.COOLIFY_URL }}/api/v1/deploy" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"uuid":"${{ vars.COOLIFY_APP_UUID }}","force":false}')
          echo "$RESPONSE"
          ID=$(printf '%s' "$RESPONSE" | jq -r '.deployments[0].deployment_uuid // empty')
          if [ -z "$ID" ]; then
            echo "::error::Coolify queued no deployment — check the app uuid"
            exit 1
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Wait for the new container
        run: |
          for i in $(seq 1 120); do
            STATUS=$(curl -fsS --max-time 10 \
              "${{ vars.COOLIFY_URL }}/api/v1/deployments/${{ steps.deploy.outputs.id }}" \
              -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" | jq -r '.status')
            case "$STATUS" in
              finished)
                echo "deployment finished after $((i * 5))s"
                break
                ;;
              failed|cancelled-by-user)
                echo "::error::Coolify deployment $STATUS — see its log in the panel"
                exit 1
                ;;
            esac
            if [ "$i" = 120 ]; then
              echo "::error::deployment still ${STATUS} after ten minutes"
              exit 1
            fi
            sleep 5
          done

      - name: Wait for it to come back
        run: |
          for i in $(seq 1 60); do
            if curl -fsS --max-time 5 "${{ vars.PUBLIC_ORIGIN }}/api/health" \
               | grep -q '"status":"ok"'; then
              echo "healthy after ${i} attempts"; exit 0
            fi
            sleep 5
          done
          echo "::error::server did not come back healthy within five minutes"
          exit 1

      - name: Activate the client
        run: |
          curl --fail-with-body -sS -X POST "${{ vars.PUBLIC_ORIGIN }}/api/client/activate" \
            -H "Authorization: Bearer ${{ secrets.ADMIN_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"buildId":"${{ github.sha }}"}'

      - name: Sync the world's content to this commit
        run: |
          curl --fail-with-body -sS -X POST "${{ vars.PUBLIC_ORIGIN }}/api/seed" \
            -H "Authorization: Bearer ${{ secrets.ADMIN_SECRET }}"

      - name: Say what is live
        run: |
          curl -sS "${{ vars.PUBLIC_ORIGIN }}/api/health"

      - name: Warn if the origin certificate is running out
        continue-on-error: true
        run: |
          HOST=$(echo "${{ vars.PUBLIC_ORIGIN }}" | sed 's|https\?://||')
          END=$(echo | openssl s_client -servername "$HOST" -connect "${{ vars.ORIGIN_IP }}:443" 2>/dev/null \
                | openssl x509 -noout -enddate | cut -d= -f2)
          LEFT=$(( ( $(date -d "$END" +%s) - $(date +%s) ) / 86400 ))
          echo "origin certificate expires in ${LEFT} days ($END)"
          if [ "$LEFT" -lt 21 ]; then
            echo "::warning::origin certificate expires in ${LEFT} days and Cloudflare will not tell you — check ACME renewal on the box"
          fi

  itch:
    name: itch.io page
    needs: deploy
    if: (inputs.environment || 'staging') == 'production'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BUTLER_VERSION: 15.31.0
      BUTLER_SHA256: 4f2a3f22b12f870923504d4b6935535cad377b45859f5fe9419e3adc0611a48c
      ITCH_TARGET: fredericoo/the-last-stones:html5
    steps:
      - uses: actions/checkout@v5

      - name: Put the logo beside the page
        run: |
          mkdir -p build/itch
          cp itch/index.html public/logo.png build/itch/

      - name: Install butler
        run: |
          curl -fsSL -o "$RUNNER_TEMP/butler.zip" \
            "https://broth.itch.zone/butler/linux-amd64/${BUTLER_VERSION}/archive/default"
          echo "${BUTLER_SHA256}  $RUNNER_TEMP/butler.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/butler.zip" -d "$RUNNER_TEMP/butler"
          echo "$RUNNER_TEMP/butler" >> "$GITHUB_PATH"

      - name: Push the page to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: butler push build/itch "$ITCH_TARGET" --userversion "${GITHUB_SHA::7}"
