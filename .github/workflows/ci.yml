name: CI

on:
  push:
    branches: [main]
  pull_request:

# A branch pushed twice in a minute does not need the first run's answer. Main
# is excluded: its runs are the record of what was green when it landed, and
# cancelling one leaves a commit nobody ever checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - run: bun install --frozen-lockfile

      # Route typegen before compiling, so a route whose types were never
      # generated fails here rather than at build time.
      - name: Typecheck
        run: bun run typecheck

      - name: App tests
        run: bun run test:unit

      # The world, in the runtime it deploys to, against a real database file.
      # This is the suite that matters: both bugs that ever shipped in
      # `server/GameServer.ts` lived in its load and restore paths and were
      # invisible to anything running against a stub. It used to run inside
      # workerd for exactly that reason and now runs on Bun for the same one.
      - name: World tests
        run: bun run test:server

      # `bun run build` is what CI ships to the client bucket, so a build that
      # does not come up is a deploy that does not either.
      - name: Build client
        run: bun run build

  perf:
    name: renderer budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - run: bun install --frozen-lockfile

      # Chromium alone: the Playwright config runs a single Desktop Chrome
      # project, and pulling the other engines is a minute per run for browsers
      # nothing opens.
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Renderer perf
        run: bun run test:perf

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
