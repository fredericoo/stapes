services:
  stapes:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      DATA_DIR: /data
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?set this}
      ADMIN_SECRET: ${ADMIN_SECRET:?set this}
      AUTH_SECRET: ${AUTH_SECRET:-}
      CHECKPOINT_INTERVAL_MS: ${CHECKPOINT_INTERVAL_MS:-2000}
      BACKUP_DIR: /backups
    volumes:
      - stapes-data:/data
      - stapes-backups:/backups
    stop_grace_period: 30s
    mem_limit: ${MEM_LIMIT:-512m}

volumes:
  stapes-data:
  stapes-backups:
