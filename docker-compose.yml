# Production, and the shape Coolify deploys.
#
# One service. There is no database container, no object storage for state and
# no static host: the world is a file on a volume, and the client comes from a
# bucket at boot.
services:
  stapes:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      DATA_DIR: /data
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?set this}
      ADMIN_SECRET: ${ADMIN_SECRET:?set this}
      CLIENT_BUCKET: ${CLIENT_BUCKET:?set this}
      CLIENT_BUCKET_ENDPOINT: ${CLIENT_BUCKET_ENDPOINT:?set this}
      CLIENT_BUCKET_REGION: ${CLIENT_BUCKET_REGION:-auto}
      CLIENT_BUCKET_ACCESS_KEY_ID: ${CLIENT_BUCKET_ACCESS_KEY_ID:?set this}
      CLIENT_BUCKET_SECRET_ACCESS_KEY: ${CLIENT_BUCKET_SECRET_ACCESS_KEY:?set this}
      CLIENT_BUILD_ID: ${CLIENT_BUILD_ID:-}
      CHECKPOINT_INTERVAL_MS: ${CHECKPOINT_INTERVAL_MS:-2000}
    volumes:
      - stapes-data:/data
    # Generous on purpose. The drain is budgeted at about two seconds, and the
    # one failure that loses somebody's world is a SIGKILL arriving mid-flush.
    stop_grace_period: 30s

volumes:
  stapes-data:
